name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      PORT: 3000
      BASE_PATH: /
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build on Ubuntu
            os: ubuntu-latest
          - name: Build on Windows
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build and frontend output verification
        run: pnpm run build

      - name: Run frontend verification tests
        run: pnpm run test:frontend-build
