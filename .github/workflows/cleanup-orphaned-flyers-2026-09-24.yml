name: Cleanup Orphaned Announcement Flyers (2026-09-24, one-off)

# Manual, one-off maintenance action -- not a recurring/scheduled job.
#
# The 2026-09-23 production maintenance wiped announcements/comments/
# discussions/inquiries/suggestions directly via setup-database.sql
# (operation 'wipe_test_data_2026_09_23'), bypassing the API's normal delete
# routes that would otherwise have removed each announcement's flyer image
# file from disk. This workflow finds any flyer files left behind with no
# matching announcement row and archives them (moves, does not delete) into
# a sibling folder so they can still be recovered if needed. It is safe to
# run more than once; a second run simply finds nothing left to archive.

on:
  workflow_dispatch:

jobs:
  cleanup:
    name: Archive orphaned announcement flyer files
    runs-on: [self-hosted, Windows, X64, cpa-production]
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Archive orphaned flyer files
        shell: powershell
        env:
          WINDOWS_DATABASE_URL: ${{ secrets.WINDOWS_DATABASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_DATABASE_URL)) {
            throw "The production environment secret WINDOWS_DATABASE_URL is required."
          }
          if (-not (Get-Command psql -ErrorAction SilentlyContinue)) {
            throw "psql is not installed or is not available on PATH for the runner service account."
          }
          ./scripts/cleanup-orphaned-flyers-2026-09-24.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Cleanup script failed with exit code $LASTEXITCODE."
          }
