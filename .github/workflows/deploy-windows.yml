name: Deploy Windows Server

on:
  workflow_dispatch:

concurrency:
  group: windows-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to CPA Windows Server
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, cpa-production]
    environment: production
    # Backstop for the whole job: without this, a step that hangs (e.g. a
    # stuck native process GitHub Actions can't cancel cleanly) is only ever
    # caught by the platform's ~6 hour default job timeout, during which
    # production sits half-deployed. Each step should fail well within this
    # window on its own; this is only the last resort.
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PORT: 3000
      BASE_PATH: /

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Validate and build API
        shell: powershell
        run: |
          pnpm run typecheck:libs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @workspace/api-server run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @workspace/api-server run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build frontend
        shell: powershell
        run: |
          pnpm --filter @workspace/cpa-planning run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply additive database setup
        shell: powershell
        env:
          WINDOWS_DATABASE_URL: ${{ secrets.WINDOWS_DATABASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_DATABASE_URL)) {
            throw "The production environment secret WINDOWS_DATABASE_URL is required."
          }
          if (-not (Get-Command psql -ErrorAction SilentlyContinue)) {
            throw "psql is not installed or is not available on PATH for the runner service account."
          }
          psql `
            --set=ON_ERROR_STOP=1 `
            --file=setup-database.sql `
            "$env:WINDOWS_DATABASE_URL"
          if ($LASTEXITCODE -ne 0) {
            throw "Database setup failed with exit code $LASTEXITCODE."
          }

      - name: Deploy and restart service
        id: deploy
        shell: powershell
        # A stuck native install used to hang here for hours with no
        # progress before GitHub Actions' ~6 hour default job timeout ever
        # stepped in. Fail fast instead: deploy-windows.ps1 time-bounds its
        # own pnpm calls well under this limit, so this is a backstop, not
        # the primary defense.
        timeout-minutes: 20
        run: |
          ./scripts/deploy-windows.ps1 `
            -SourcePath $env:GITHUB_WORKSPACE `
            -DeploymentPath 'C:\Planning\CPA-Planning-Platform' `
            -ServiceName 'CPAPlanningAP' `
            -HealthUrl 'http://127.0.0.1:3000/api/healthz' `
            -PublicAuthUrl 'https://planning.cpa.gov.om/api/auth/me'

      - name: Notify Microsoft Teams on deploy failure
        # Fast failure only helps if someone finds out fast: without this,
        # a failed deploy (rolled back or not) is only ever noticed by
        # someone manually checking the Actions run. Scoped to this one
        # step's outcome (not job-wide failure()) so an earlier build/test
        # failure -- which never touches production -- doesn't also page.
        if: always() && steps.deploy.outcome == 'failure'
        shell: powershell
        timeout-minutes: 2
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_DEPLOY_WEBHOOK_URL }}
          DEPLOY_ERROR: ${{ steps.deploy.outputs.deploy_error }}
          ROLLBACK_SUCCEEDED: ${{ steps.deploy.outputs.rollback_succeeded }}
          ROLLBACK_ERROR: ${{ steps.deploy.outputs.rollback_error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TEAMS_WEBHOOK_URL)) {
            Write-Warning "TEAMS_DEPLOY_WEBHOOK_URL secret is not set; skipping Teams notification for this failed deploy."
            exit 0
          }
          ./scripts/notify-deploy-failure.ps1 `
            -WebhookUrl $env:TEAMS_WEBHOOK_URL `
            -DeployError $env:DEPLOY_ERROR `
            -RollbackSucceeded $env:ROLLBACK_SUCCEEDED `
            -RollbackError $env:ROLLBACK_ERROR `
            -RunUrl $env:RUN_URL