openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CPA Planning Department Interactive Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: announcements
    description: Announcements and updates
  - name: discussions
    description: Participatory discussions
  - name: comments
    description: Discussion comments
  - name: inquiries
    description: Employee inquiries
  - name: documents
    description: Knowledge base documents
  - name: faqs
    description: Frequently asked questions
  - name: suggestions
    description: Employee suggestions
  - name: glossary
    description: Glossary and terminology definitions
  - name: dashboard
    description: Dashboard statistics and analytics
  - name: anthropic
    description: Anthropic AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user's password (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "204":
          description: Password reset successfully

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List announcements
      parameters:
        - name: archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create an announcement
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AnnouncementMultipartInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /announcements/{id}:
    patch:
      operationId: updateAnnouncement
      tags: [announcements]
      summary: Update an announcement (archive/restore)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AnnouncementMultipartUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Delete an announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /discussions:
    get:
      operationId: listDiscussions
      tags: [discussions]
      summary: List discussions
      responses:
        "200":
          description: List of discussions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Discussion"
    post:
      operationId: createDiscussion
      tags: [discussions]
      summary: Create a discussion topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscussionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"

  /discussions/{id}:
    get:
      operationId: getDiscussion
      tags: [discussions]
      summary: Get a discussion with its comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discussion detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscussionDetail"
    patch:
      operationId: updateDiscussion
      tags: [discussions]
      summary: Update discussion status (open/closed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscussionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"

  /discussions/{id}/comments:
    post:
      operationId: createComment
      tags: [comments]
      summary: Post a comment on a discussion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /inquiries:
    get:
      operationId: listInquiries
      tags: [inquiries]
      summary: List inquiries
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inquiry"
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit an inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"

  /inquiries/{id}:
    patch:
      operationId: updateInquiry
      tags: [inquiries]
      summary: Respond to or resolve an inquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List knowledge base documents
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Add a document to the knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /faqs:
    get:
      operationId: listFaqs
      tags: [faqs]
      summary: List FAQ entries
      responses:
        "200":
          description: List of FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faq"
    post:
      operationId: createFaq
      tags: [faqs]
      summary: Create a FAQ entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faq"

  /faqs/{id}:
    patch:
      operationId: updateFaq
      tags: [faqs]
      summary: Update a FAQ entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faq"
    delete:
      operationId: deleteFaq
      tags: [faqs]
      summary: Delete a FAQ entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /suggestions:
    get:
      operationId: listSuggestions
      tags: [suggestions]
      summary: List suggestions
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Suggestion"
    post:
      operationId: createSuggestion
      tags: [suggestions]
      summary: Submit a suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"

  /suggestions/{id}:
    patch:
      operationId: updateSuggestion
      tags: [suggestions]
      summary: Update suggestion status or feedback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"

  /glossary:
    get:
      operationId: listGlossary
      tags: [glossary]
      summary: List glossary entries
      responses:
        "200":
          description: List of glossary entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GlossaryEntry"
    post:
      operationId: createGlossaryEntry
      tags: [glossary]
      summary: Add a glossary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlossaryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlossaryEntry"

  /glossary/{id}:
    delete:
      operationId: deleteGlossaryEntry
      tags: [glossary]
      summary: Delete a glossary entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/analytics:
    get:
      operationId: getDashboardAnalytics
      tags: [dashboard]
      summary: Get rich analytics data for charts and reports
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAnalytics"

  /dashboard/ai-insights:
    post:
      operationId: getDashboardAiInsights
      tags: [dashboard]
      summary: Generate AI-powered insights from dashboard analytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardAnalytics"
      responses:
        "200":
          description: AI-generated bilingual insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardInsightsResponse"

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, nameAr, role, active, createdAt]
      properties:
        id:
          type: integer
        nameAr:
          type: string
        nameEn:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        directorate:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        section:
          type: ["string", "null"]
        role:
          type: string
          enum: [employee, officer, manager, admin]
        active:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [nameAr, role]
      properties:
        nameAr:
          type: string
        nameEn:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        directorate:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        section:
          type: ["string", "null"]
        role:
          type: string
          enum: [employee, officer, manager, admin]

    ResetPasswordBody:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8

    UserUpdate:
      type: object
      properties:
        nameAr:
          type: string
        nameEn:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        directorate:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        section:
          type: ["string", "null"]
        role:
          type: string
          enum: [employee, officer, manager, admin]
        active:
          type: boolean

    Announcement:
      type: object
      required: [id, title, body, category, date, authorId, authorName, archived, flyerPath, flyerName, flyerMimeType, flyerSize]
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        category:
          type: string
          enum: [announcement, update, circular, deadline]
        date:
          type: string
        authorId:
          type: integer
        authorName:
          type: string
        archived:
          type: boolean
        flyerPath:
          type: ["string", "null"]
        flyerName:
          type: ["string", "null"]
        flyerMimeType:
          type: ["string", "null"]
          enum: [image/jpeg, image/png, image/webp, image/gif, null]
        flyerSize:
          type: ["integer", "null"]

    AnnouncementInput:
      type: object
      required: [title, body, category, authorId]
      properties:
        title:
          type: string
        body:
          type: string
        category:
          type: string
          enum: [announcement, update, circular, deadline]
        authorId:
          type: integer

    AnnouncementMultipartInput:
      type: object
      required: [data]
      properties:
        data:
          type: string
          description: JSON encoded announcement fields (title, body, category, and optional flyerPath). The author is taken from the authenticated session.
        flyer:
          type: string
          description: Optional multipart flyer image. Supported formats are JPEG, PNG, WebP, and GIF.

    AnnouncementMultipartUpdate:
      type: object
      required: [data]
      properties:
        data:
          type: string
          description: JSON encoded fields to update, including optional removeFlyer boolean.
        flyer:
          type: string
          description: Optional multipart replacement flyer image.

    AnnouncementUpdate:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        category:
          type: string
          enum: [announcement, update, circular, deadline]
        archived:
          type: boolean

    Discussion:
      type: object
      required: [id, title, description, status, date, authorId, authorName, commentCount]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, closed]
        date:
          type: string
        authorId:
          type: integer
        authorName:
          type: string
        authorDesignation:
          type: ["string", "null"]
        authorDepartment:
          type: ["string", "null"]
        commentCount:
          type: integer

    DiscussionDetail:
      type: object
      required: [id, title, description, status, date, authorId, authorName, comments]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, closed]
        date:
          type: string
        authorId:
          type: integer
        authorName:
          type: string
        authorDesignation:
          type: ["string", "null"]
        authorDepartment:
          type: ["string", "null"]
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"

    DiscussionInput:
      type: object
      required: [title, description, authorId]
      properties:
        title:
          type: string
        description:
          type: string
        authorId:
          type: integer

    DiscussionUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed]
        title:
          type: string
        description:
          type: string

    Comment:
      type: object
      required: [id, discussionId, userId, userName, isStaff, text, date]
      properties:
        id:
          type: integer
        discussionId:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        userDesignation:
          type: ["string", "null"]
        userDepartment:
          type: ["string", "null"]
        isStaff:
          type: boolean
        text:
          type: string
        date:
          type: string

    CommentInput:
      type: object
      required: [userId, text]
      properties:
        userId:
          type: integer
        text:
          type: string

    InquiryCategory:
      type: string
      enum: [strategic_planning, annual_plan, projects, kpis, monitoring, performance_platform, templates, policies, other]

    Inquiry:
      type: object
      required: [id, userId, userName, subject, details, status, date]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        userDesignation:
          type: ["string", "null"]
        userDepartment:
          type: ["string", "null"]
        subject:
          type: string
        details:
          type: string
        category:
          $ref: "#/components/schemas/InquiryCategory"
        status:
          type: string
          enum: [open, answered, resolved]
        date:
          type: string
        response:
          type: ["string", "null"]
        responderId:
          type: ["integer", "null"]
        responderName:
          type: ["string", "null"]
        responderDesignation:
          type: ["string", "null"]
        responderDepartment:
          type: ["string", "null"]

    InquiryInput:
      type: object
      required: [userId, subject, details]
      properties:
        userId:
          type: integer
        subject:
          type: string
        details:
          type: string
        category:
          $ref: "#/components/schemas/InquiryCategory"

    InquiryUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, answered, resolved]
        response:
          type: string
        responderId:
          type: integer

    Document:
      type: object
      required: [id, name, category, description, date]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [manuals, guidelines, kpi, policies, templates, annual-plans, reports, other]
        description:
          type: string
        date:
          type: string
        fileUrl:
          type: ["string", "null"]

    DocumentInput:
      type: object
      required: [name, category, description]
      properties:
        name:
          type: string
        category:
          type: string
          enum: [manuals, guidelines, kpi, policies, templates, annual-plans, reports, other]
        description:
          type: string
        fileUrl:
          type: ["string", "null"]

    Faq:
      type: object
      required: [id, question, answer]
      properties:
        id:
          type: integer
        question:
          type: string
        answer:
          type: string

    FaqInput:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
        answer:
          type: string

