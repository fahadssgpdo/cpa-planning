openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CPA Planning Department Interactive Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: announcements
    description: Announcements and updates
  - name: discussions
    description: Participatory discussions
  - name: comments
    description: Discussion comments
  - name: inquiries
    description: Employee inquiries
  - name: documents
    description: Knowledge base documents
  - name: faqs
    description: Frequently asked questions
  - name: suggestions
    description: Employee suggestions
  - name: dashboard
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List announcements
      parameters:
        - name: archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /announcements/{id}:
    patch:
      operationId: updateAnnouncement
      tags: [announcements]
      summary: Update an announcement (archive/restore)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Delete an announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /discussions:
    get:
      operationId: listDiscussions
      tags: [discussions]
      summary: List discussions
      responses:
        "200":
          description: List of discussions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Discussion"
    post:
      operationId: createDiscussion
      tags: [discussions]
      summary: Create a discussion topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscussionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"

  /discussions/{id}:
    get:
      operationId: getDiscussion
      tags: [discussions]
      summary: Get a discussion with its comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discussion detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscussionDetail"
    patch:
      operationId: updateDiscussion
      tags: [discussions]
      summary: Update discussion status (open/closed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscussionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"

  /discussions/{id}/comments:
    post:
      operationId: createComment
      tags: [comments]
      summary: Post a comment on a discussion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /inquiries:
    get:
      operationId: listInquiries
      tags: [inquiries]
      summary: List inquiries
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inquiry"
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit an inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"

  /inquiries/{id}:
    patch:
      operationId: updateInquiry
      tags: [inquiries]
      summary: Respond to or resolve an inquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List knowledge base documents
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Add a document to the knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /faqs:
    get:
      operationId: listFaqs
      tags: [faqs]
      summary: List FAQ entries
      responses:
        "200":
          description: List of FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faq"
    post:
      operationId: createFaq
      tags: [faqs]
      summary: Create a FAQ entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faq"

  /faqs/{id}:
    patch:
      operationId: updateFaq
      tags: [faqs]
      summary: Update a FAQ entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faq"
    delete:
      operationId: deleteFaq
      tags: [faqs]
      summary: Delete a FAQ entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /suggestions:
    get:
      operationId: listSuggestions
      tags: [suggestions]
      summary: List suggestions
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Suggestion"
    post:
      operationId: createSuggestion
      tags: [suggestions]
      summary: Submit a suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"

  /suggestions/{id}:
    patch:
      operationId: updateSuggestion
      tags: [suggestions]
      summary: Update suggestion status or feedback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, nameAr, role, active, createdAt]
      properties:
        id:
          type: integer
        nameAr:
          type: string
        nameEn:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        directorate:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        section:
          type: ["string", "null"]
        role:
          type: string
          enum: [employee, officer, manager, admin]
        active:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [nameAr, role]
      properties:
        nameAr:
          type: string
        nameEn:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        directorate:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        section:
          type: ["string", "null"]
        role:
          type: string
          enum: [employee, officer, manager, admin]

    UserUpdate:
      type: object
      properties:
        nameAr:
          type: string
        nameEn:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        directorate:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        section:
          type: ["string", "null"]
        role:
          type: string
          enum: [employee, officer, manager, admin]
        active:
          type: boolean

    Announcement:
      type: object
      required: [id, title, body, category, date, authorId, authorName, archived]
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        category:
          type: string
          enum: [announcement, update, circular, deadline]
        date:
          type: string
        authorId:
          type: integer
        authorName:
          type: string
        archived:
          type: boolean

    AnnouncementInput:
      type: object
      required: [title, body, category, authorId]
      properties:
        title:
          type: string
        body:
          type: string
        category:
          type: string
          enum: [announcement, update, circular, deadline]
        authorId:
          type: integer

    AnnouncementUpdate:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        category:
          type: string
          enum: [announcement, update, circular, deadline]
        archived:
          type: boolean

    Discussion:
      type: object
      required: [id, title, description, status, date, authorId, authorName, commentCount]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, closed]
        date:
          type: string
        authorId:
          type: integer
        authorName:
          type: string
        commentCount:
          type: integer

    DiscussionDetail:
      type: object
      required: [id, title, description, status, date, authorId, authorName, comments]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, closed]
        date:
          type: string
        authorId:
          type: integer
        authorName:
          type: string
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"

    DiscussionInput:
      type: object
      required: [title, description, authorId]
      properties:
        title:
          type: string
        description:
          type: string
        authorId:
          type: integer

    DiscussionUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed]
        title:
          type: string
        description:
          type: string

    Comment:
      type: object
      required: [id, discussionId, userId, userName, isStaff, text, date]
      properties:
        id:
          type: integer
        discussionId:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        isStaff:
          type: boolean
        text:
          type: string
        date:
          type: string

    CommentInput:
      type: object
      required: [userId, text]
      properties:
        userId:
          type: integer
        text:
          type: string

    Inquiry:
      type: object
      required: [id, userId, userName, subject, details, status, date]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        subject:
          type: string
        details:
          type: string
        status:
          type: string
          enum: [open, answered, resolved]
        date:
          type: string
        response:
          type: ["string", "null"]
        responderId:
          type: ["integer", "null"]
        responderName:
          type: ["string", "null"]

    InquiryInput:
      type: object
      required: [userId, subject, details]
      properties:
        userId:
          type: integer
        subject:
          type: string
        details:
          type: string

    InquiryUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, answered, resolved]
        response:
          type: string
        responderId:
          type: integer

    Document:
      type: object
      required: [id, name, category, description, date]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [manuals, guidelines, kpi, policies, templates, other]
        description:
          type: string
        date:
          type: string
        fileUrl:
          type: ["string", "null"]

    DocumentInput:
      type: object
      required: [name, category, description]
      properties:
        name:
          type: string
        category:
          type: string
          enum: [manuals, guidelines, kpi, policies, templates, other]
        description:
          type: string
        fileUrl:
          type: ["string", "null"]

    Faq:
      type: object
      required: [id, question, answer]
      properties:
        id:
          type: integer
        question:
          type: string
        answer:
          type: string

    FaqInput:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
        answer:
          type: string

    FaqUpdate:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string

    Suggestion:
      type: object
      required: [id, userId, userName, category, text, status, date]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        category:
          type: string
          enum: [improvement, initiative, process, feedback]
        text:
          type: string
        status:
          type: string
          enum: [new, under_review, accepted, rejected, implemented]
        date:
          type: string
        feedback:
          type: ["string", "null"]
        attachment:
          type: ["string", "null"]

    SuggestionInput:
      type: object
      required: [userId, category, text]
      properties:
        userId:
          type: integer
        category:
          type: string
          enum: [improvement, initiative, process, feedback]
        text:
          type: string
        attachment:
          type: string

    SuggestionUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [new, under_review, accepted, rejected, implemented]
        feedback:
          type: string

    DashboardStats:
      type: object
      required: [openInquiries, newSuggestions, activeDiscussions, totalDocuments, recentAnnouncements, totalUsers]
      properties:
        openInquiries:
          type: integer
        newSuggestions:
          type: integer
        activeDiscussions:
          type: integer
        totalDocuments:
          type: integer
        recentAnnouncements:
          type: integer
        totalUsers:
          type: integer
